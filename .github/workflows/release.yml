name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/UsageCore.Tests
      - name: Build x64 and arm64
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          pwsh windows/build.ps1 -Version $version -Runtime win-x64
          pwsh windows/build.ps1 -Version $version -Runtime win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ClaudeUsageBar-windows-*.zip

  release:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh --arch arm64 --arch x86_64
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ClaudeUsageBar.zip dist/ClaudeUsageBar-windows-*.zip --generate-notes
