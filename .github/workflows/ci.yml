name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: scripts/bundle.sh --arch arm64 --arch x86_64
      - name: Check bundle
        run: |
          ARCHS=$(lipo -archs dist/ClaudeUsageBar.app/Contents/MacOS/ClaudeUsageBar)
          [[ $ARCHS == *arm64* && $ARCHS == *x86_64* ]]
          codesign --verify dist/ClaudeUsageBar.app
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar
          path: dist/ClaudeUsageBar.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/UsageCore.Tests
      - name: Build app
        run: pwsh windows/build.ps1
      - name: Check app
        # Renders the panel offscreen: proves the single-file exe starts and draws without a .NET install.
        run: |
          dist/windows/ClaudeUsageBar.exe --snapshot "$env:RUNNER_TEMP/snapshot.png" | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP/snapshot.png")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar-windows
          path: dist/ClaudeUsageBar-windows-x64.zip
